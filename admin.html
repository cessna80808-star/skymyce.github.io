<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<meta name="robots" content="noindex">
<title>Sky-Myce — Admin</title>
<meta name="theme-color" content="#0a0a0c">
<link rel="icon" type="image/png" href="assets/icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<link rel="stylesheet" href="admin.css">
<script>document.documentElement.classList.add('js');</script>
<script defer src="js/config.js"></script>
<script defer src="js/core.js"></script>
<script defer src="js/api.js"></script>
<script defer src="js/demo.js"></script>
<script defer src="js/guide-content.js"></script>
<script defer src="js/motion.js"></script>
<script defer src="js/admin.js"></script>
</head>
<body class="admin-body">
<a class="skip-link" href="#admin-view">Skip to panel</a>

<!-- Auth gate -->
<div class="auth-gate" id="auth-gate">
  <div class="gate-card">
    <span class="gate-logo" aria-hidden="true">
      <svg viewBox="0 0 16 16" width="26" height="26"><path d="M8 2l5 2v4c0 3-2 5.4-5 6.4C5 13.4 3 11 3 8V4l5-2z" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"/><path d="M5.8 8.2l1.5 1.5 3-3" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </span>
    <div id="auth-gate-body">
      <h2>Checking session…</h2>
      <p>One moment.</p>
    </div>
  </div>
</div>

<!-- Admin shell -->
<div class="admin-shell" id="admin-shell" hidden>
  <header class="admin-top">
    <div class="admin-top-inner">
      <a class="brand" href="index.html" aria-label="Back to the site">
        <img src="assets/icon.png" alt="" width="26" height="26">
        <span>Sky-Myce</span>
      </a>
      <span class="crumb-sep" aria-hidden="true">/</span>
      <span class="crumb" id="admin-crumb">Overview</span>
      <div class="admin-top-right">
        <span class="admin-status" id="admin-status" data-state="boot">
          <span class="status-dot"></span>
          <span id="admin-status-label">Connecting…</span>
        </span>
        <div id="admin-user"></div>
      </div>
    </div>
    <span class="scroll-progress" id="scroll-progress" aria-hidden="true"></span>
  </header>

  <div class="admin-main">
    <aside class="admin-rail">
      <nav class="rail-nav" id="admin-nav" aria-label="Admin sections"></nav>
    </aside>
    <main class="admin-view" id="admin-view" tabindex="-1">
      <noscript><p>Admin requires JavaScript.</p></noscript>
    </main>
  </div>
</div>

<!-- Confirm dialog -->
<div class="confirm-overlay" id="admin-confirm" hidden></div>

<!-- Toasts -->
<div class="toast-host" id="admin-toasts" aria-live="polite"></div>
</body>
</html>
